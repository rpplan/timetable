<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works timetable</title>
  <meta name="description" content="Office timetable: who measures which site, billing and advance days, and meetings.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a href="#/today" class="brand"><img src="assets/icon.svg" alt="" width="30" height="30"><span><b id="title">Works timetable</b><small id="range"></small></span></a>
      <div class="top-acts">
        <button type="button" id="clash-badge" class="badge" hidden></button>
        <button type="button" id="bmode" class="btn ghost"></button>
        <button type="button" id="undo" class="btn ghost" disabled>Undo</button>
        <button type="button" id="add" class="btn primary">Add work</button>
      </div>
    </div>
    <nav id="nav" class="mainnav" aria-label="Pages"></nav>
  </header>
  <main id="view" class="wrap" tabindex="-1"></main>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/js/defaults.js"></script>
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/io.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/bmode.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
